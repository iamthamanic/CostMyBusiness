appRoot: .

devCommand: npm run dev
devUrl: http://localhost:5173

checksCommand: npm run checks
e2eCommand: npm run test:e2e

styleguide: docs/UI_STYLEGUIDE.md
designDir: .qa/design
acceptanceDir: .qa/acceptance
evidenceDir: .qa/evidence

locale: de

# Planned stack profile (app not bootstrapped yet — first queue issue creates package.json)
stackProfile: vite-react

security:
  checklist: secure-by-default

typedStrict:
  languages: [typescript]

testGate:
  profile: vite-react
  depthDefault: standard
  runner: scripts
  always:
    - typedStrict
    - secureByDefault
    - rgSecretsDiff
  never:
    - aiReview
    - explanationCheck
    - fallow
    - updateReadme
    - mutation

issueContract:
  template: global
  labels: [P0, P1, P2, needs-design]
  maxAcceptanceBullets: 5
  runtimeAxes: []
  securitySection: true
  locale: de

viewports:
  - name: mobile
    width: 390
    height: 844
  - name: desktop
    width: 1280
    height: 720

navigation:
  - Übersicht
  - Unternehmen
  - Produkte
  - Szenarien
  - Vorlagen
  - Glossar
  - Einstellungen
